name: Deploy player to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - id: pages
        uses: actions/configure-pages@v5
      # The player is served from the repository subpath, e.g. /PixelParade/.
      - run: bun run web:build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
